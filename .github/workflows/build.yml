name: Build Electron App

on:
  push:
    branches:
      - master # Cambia esto si usas otra rama como 'master'
  pull_request:
    branches:
      - master

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Make for macOS
        run: npm run make -- --platform=darwin --verbose

      - name: List generated files
        run: ls -la out/make/ || echo "No files found in out/make/"

      - name: Upload artifacts
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v3.1.3 explícita
        with:
          name: macos-build
          path: out/make/**/*.{zip,dmg}
        continue-on-error: true # Evita que falle el flujo si no hay archivos

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Make for Windows
        run: npm run make -- --platform=win32 --verbose

      - name: List generated files
        run: dir out\make || echo "No files found in out/make/"

      - name: Upload artifacts
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v3.1.3 explícita
        with:
          name: windows-build
          path: out/make/**/*.exe
        continue-on-error: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Make for Linux
        run: npm run make -- --platform=linux --verbose

      - name: List generated files
        run: ls -la out/make/ || echo "No files found in out/make/"

      - name: Upload artifacts
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v3.1.3 explícita
        with:
          name: linux-build
          path: out/make/**/*.{deb,rpm}
        continue-on-error: true
