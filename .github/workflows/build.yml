name: Build Electron App

on:
  push:
    branches:
      - master
      - 'release/*'
  pull_request:
    branches:
      - master
      - 'release/*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for macOS
        run: npm run make -- --platform=darwin --verbose

      - name: Get version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create/Update release and upload macOS assets
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          artifacts: |
            out/make/**/*.dmg
            out/make/**/*.zip
          artifactContentType: application/zip
          allowUpdates: true
          replacesArtifacts: true
          owner: matifanger
          repo: DevKitHub-Releases
          token: ${{ secrets.GH_RELEASES_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Windows
        run: npm run make -- --platform=win32 --arch=x64 --verbose

      - name: Get version from package.json
        run: |
          $version = node -p "require('./package.json').version"
          Write-Host "Version captured: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Create/Update release and upload Windows assets
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          artifacts: |
            out/make/**/*.exe
          artifactContentType: application/octet-stream
          allowUpdates: true
          replacesArtifacts: true
          owner: matifanger
          repo: DevKitHub-Releases
          token: ${{ secrets.GH_RELEASES_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Linux
        run: npm run make -- --platform=linux --verbose

      - name: Get version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create/Update release and upload Linux assets
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          artifacts: |
            out/make/**/*.deb
            out/make/**/*.rpm
          artifactContentType: application/zip
          allowUpdates: true
          replacesArtifacts: true
          owner: matifanger
          repo: DevKitHub-Releases
          token: ${{ secrets.GH_RELEASES_TOKEN }}
