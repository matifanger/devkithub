name: Build Electron App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for macOS
        run: npm run make -- --platform=darwin --verbose

      - name: List all generated files
        run: |
          echo "Listing out/ directory:"
          ls -la out/ || echo "No files found in out/"
          echo "Listing out/make/ directory:"
          ls -la out/make/ || echo "No files found in out/make/"

      - name: Install AWS CLI
        run: brew install awscli

      - name: Configure AWS CLI for MinIO
        run: |
          aws configure set aws_access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
          aws configure set default.region us-east-1
          aws configure set default.s3.signature_version s3v4

      - name: Upload to MinIO
        run: |
          VERSION=$(node -p "require('./package.json').version")
          aws --endpoint-url https://releases.devkithub.com s3 cp out/make/ s3://releases/$VERSION/macos/ --recursive --no-verify-ssl

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Windows
        run: npm run make -- --platform=win32 --verbose

      - name: List all generated files
        run: |
          echo "Listing out\ directory:"
          dir out || echo "No files found in out\"
          echo "Listing out\make\ directory:"
          dir out\make || echo "No files found in out\make\"

      - name: Install AWS CLI
        run: |
          curl -o AWSCLIV2.msi https://awscli.amazonaws.com/AWSCLIV2.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i AWSCLIV2.msi /quiet /norestart'
          Write-Host "AWS CLI installed, setting up path"
          $env:PATH = "$env:PATH;C:\Program Files\Amazon\AWSCLIV2"
          Write-Host "Current PATH: $env:PATH"
          # Verify installation location
          Get-ChildItem "C:\Program Files\Amazon\" -Recurse | Where-Object {$_.Name -eq "aws.exe"} | ForEach-Object { Write-Host "Found aws.exe at: $($_.FullName)" }
          # Add to PATH for current session
          $env:PATH += ";C:\Program Files\Amazon\AWSCLIV2"
          # Also try the path reported by the installer
          $env:PATH += ";C:\Program Files\Amazon\AWSCLIV2\bin"
          aws --version
        shell: pwsh

      - name: Configure AWS CLI for MinIO
        run: |
          # Use full path to aws executable
          & 'C:\Program Files\Amazon\AWSCLIV2\aws' configure set aws_access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          & 'C:\Program Files\Amazon\AWSCLIV2\aws' configure set aws_secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
          & 'C:\Program Files\Amazon\AWSCLIV2\aws' configure set default.region us-east-1
          & 'C:\Program Files\Amazon\AWSCLIV2\aws' configure set default.s3.signature_version s3v4
        shell: pwsh

      - name: Upload to MinIO
        run: |
          $env:VERSION = $(node -p "require('./package.json').version")
          Write-Host "Version captured: $env:VERSION" # Optional: for logging
          & 'C:\Program Files\Amazon\AWSCLIV2\aws' --endpoint-url https://releases.devkithub.com s3 cp out/make/ "s3://releases/$($env:VERSION)/windows/" --recursive --no-verify-ssl
        shell: pwsh # Explicitly specify powershell, though it's often the default

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Package app first
        run: npm run package -- --platform=linux --verbose

      - name: Check packaged app structure
        run: |
          echo "Checking packaged app structure..."
          ls -la out/
          if [ -d "out/DevKitHub-linux-x64" ]; then
            echo "DevKitHub-linux-x64 directory exists"
            ls -la out/DevKitHub-linux-x64/
            # Create symbolic link if needed
            if [ -f "out/DevKitHub-linux-x64/DevKitHub" ] && [ ! -f "out/DevKitHub-linux-x64/devkithub" ]; then
              echo "Creating symbolic link devkithub -> DevKitHub"
              cd out/DevKitHub-linux-x64
              ln -sf DevKitHub devkithub
              cd ../../
            fi
          else
            echo "DevKitHub-linux-x64 directory does not exist"
          fi

      - name: Make for Linux
        run: npm run make -- --platform=linux --verbose

      - name: List all generated files
        run: |
          echo "Listing out/ directory:"
          ls -la out/ || echo "No files found in out/"
          echo "Listing out/make/ directory:"
          ls -la out/make/ || echo "No files found in out/make/"

      - name: Check AWS CLI version
        run: aws --version

      - name: Configure AWS CLI for MinIO
        run: |
          aws configure set aws_access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
          aws configure set default.region us-east-1
          aws configure set default.s3.signature_version s3v4

      - name: Upload to MinIO
        run: |
          VERSION=$(node -p "require('./package.json').version")
          aws --endpoint-url https://releases.devkithub.com s3 cp out/make/ s3://releases/$VERSION/linux/ --recursive --no-verify-ssl
