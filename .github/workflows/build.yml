name: Build Electron App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for macOS
        run: npm run make -- --platform=darwin --verbose

      - name: List all generated files
        run: |
          echo "Listing out/ directory:"
          ls -la out/ || echo "No files found in out/"
          echo "Listing out/make/ directory:"
          ls -la out/make/ || echo "No files found in out/make/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: out/make/ # Subimos toda la carpeta
        continue-on-error: true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Windows
        run: npm run make -- --platform=win32 --verbose

      - name: List all generated files
        run: |
          echo "Listing out\ directory:"
          dir out || echo "No files found in out\"
          echo "Listing out\make\ directory:"
          dir out\make || echo "No files found in out\make\"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/make/ # Subimos toda la carpeta
        continue-on-error: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Linux
        run: npm run make -- --platform=linux --verbose

      - name: List all generated files
        run: |
          echo "Listing out/ directory:"
          ls -la out/ || echo "No files found in out/"
          echo "Listing out/make/ directory:"
          ls -la out/make/ || echo "No files found in out/make/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: out/make/ # Subimos toda la carpeta
        continue-on-error: true
