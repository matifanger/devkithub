name: Build Electron App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for macOS
        run: npm run make -- --platform=darwin --verbose

      - name: List all generated files
        run: |
          echo "Listing out/ directory:"
          ls -la out/ || echo "No files found in out/"
          echo "Listing out/make/ directory:"
          ls -la out/make/ || echo "No files found in out/make/"

      - name: Install AWS CLI
        run: brew install awscli

      - name: Configure AWS CLI for MinIO
        run: |
          aws configure set aws_access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
          aws configure set default.region us-east-1
          aws configure set default.s3.signature_version s3v4

      - name: Upload to MinIO
        run: |
          VERSION=$(node -p "require('./package.json').version")
          aws --endpoint-url https://console-minio.devkithub.com s3 cp out/make/ s3://releases/$VERSION/macos/ --recursive --cli-connect-timeout 60 --cli-read-timeout 60 --retry 5 --retry-delay 10

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Windows
        run: npm run make -- --platform=win32 --verbose

      - name: List all generated files
        run: |
          echo "Listing out\ directory:"
          dir out || echo "No files found in out\"
          echo "Listing out\make\ directory:"
          dir out\make || echo "No files found in out\make\"

      - name: Install AWS CLI
        run: |
          curl -o AWSCLIV2.msi https://awscli.amazonaws.com/AWSCLIV2.msi
          msiexec.exe /i AWSCLIV2.msi /quiet
          set "PATH=%PATH%;C:\Program Files\Amazon\AWSCLIV2\"
          aws --version

      - name: Configure AWS CLI for MinIO
        run: |
          aws configure set aws_access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
          aws configure set default.region us-east-1
          aws configure set default.s3.signature_version s3v4

      - name: Upload to MinIO
        run: |
          $env:VERSION = $(node -p "require('./package.json').version")
          Write-Host "Version captured: $env:VERSION" # Optional: for logging
          aws --endpoint-url https://console-minio.devkithub.com s3 cp out/make/ "s3://releases/$($env:VERSION)/windows/" --recursive --cli-connect-timeout 60 --cli-read-timeout 60 --retry 5 --retry-delay 10
        shell: pwsh # Explicitly specify powershell, though it's often the default

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native dependencies
        run: npx electron-rebuild

      - name: Make for Linux
        run: npm run make -- --platform=linux --verbose

      - name: List all generated files
        run: |
          echo "Listing out/ directory:"
          ls -la out/ || echo "No files found in out/"
          echo "Listing out/make/ directory:"
          ls -la out/make/ || echo "No files found in out/make/"

      - name: Check AWS CLI version
        run: aws --version

      - name: Configure AWS CLI for MinIO
        run: |
          aws configure set aws_access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
          aws configure set default.region us-east-1
          aws configure set default.s3.signature_version s3v4

      - name: Upload to MinIO
        run: |
          VERSION=$(node -p "require('./package.json').version")
          aws --endpoint-url https://console-minio.devkithub.com s3 cp out/make/ s3://releases/$VERSION/linux/ --recursive --cli-connect-timeout 60 --cli-read-timeout 60 --retry 5 --retry-delay 10
